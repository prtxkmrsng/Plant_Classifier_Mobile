name: plant_classifier_mobile
description: "Instant On-Device Plant and Leaf Classifier App Powered by PyTorch Mobile Lite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera hardware access
  camera: ^0.11.0

  # On-device PyTorch Lite inference runtime
  pytorch_lite: ^4.0.0

  # Pick images from gallery
  image_picker: ^1.1.2

  # Premium typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/best_plant_model.ptl
    - assets/labels.txt