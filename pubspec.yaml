name: plant_classifier_mobile
description: "Instant On-Device Plant and Leaf Classifier App Powered by PyTorch Mobile Lite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0' # Anchored to your configured Dart Toolchain version

dependencies:
  flutter:
    sdk: flutter

  # Native device hardware abstraction tools
  camera: ^0.11.0
  
  # Highly-optimized native deep learning runtime for low-overhead local execution
  pytorch_lite: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset binding configuration ensuring local compilation includes your files
  assets:
    - assets/best_plant_model.ptl
    - assets/labels.txt